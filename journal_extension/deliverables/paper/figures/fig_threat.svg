<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 335" font-family="Liberation Serif, Times New Roman, DejaVu Serif, serif" font-size="16">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M0,1 L10,5 L0,9 z" fill="#333"/>
  </marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M0,1 L10,5 L0,9 z" fill="#b71c1c"/>
  </marker>
</defs>
<rect width="980" height="335" fill="white"/>
<!-- agent -->
<rect x="20" y="40" width="175" height="110" rx="8" fill="#eef4fb" stroke="#2b5797" stroke-width="1.8"/>
<text x="107.5" y="78" text-anchor="middle" font-weight="bold" fill="#1a365d">LLM agent</text>
<text x="107.5" y="103" text-anchor="middle" fill="#222">decides among</text>
<text x="107.5" y="125" text-anchor="middle" fill="#222">options A, B, C</text>
<!-- tools -->
<g fill="#eff8ef" stroke="#2e7d32" stroke-width="1.8">
  <rect x="305" y="20" width="150" height="40" rx="6"/>
  <rect x="305" y="75" width="150" height="40" rx="6"/>
  <rect x="305" y="130" width="150" height="40" rx="6"/>
</g>
<text x="380" y="45" text-anchor="middle" fill="#1b4d20">Tool 1 → <tspan font-style="italic">o</tspan><tspan dy="4" font-size="12">1</tspan></text>
<text x="380" y="100" text-anchor="middle" fill="#1b4d20">Tool 2 → <tspan font-style="italic">o</tspan><tspan dy="4" font-size="12">2</tspan></text>
<text x="380" y="155" text-anchor="middle" fill="#1b4d20">Tool 3 → <tspan font-style="italic">o</tspan><tspan dy="4" font-size="12">3</tspan></text>
<path d="M195 70 L302 42" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M195 95 L302 95" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M195 120 L302 148" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="250" y="192" text-anchor="middle" font-size="14.5" fill="#444">parallel tool calls</text>
<!-- scheduler -->
<rect x="565" y="40" width="205" height="110" rx="8" fill="#fdf0ef" stroke="#b71c1c" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="667.5" y="75" text-anchor="middle" font-weight="bold" fill="#b71c1c">Attacker</text>
<text x="667.5" y="100" text-anchor="middle" fill="#222">delays completion only</text>
<text x="667.5" y="126" text-anchor="middle" fill="#222"><tspan font-style="italic">t</tspan><tspan dy="4" font-size="11" font-style="italic">i</tspan><tspan dy="-9" dx="-2" font-size="13">′</tspan><tspan dy="5" dx="3">=</tspan><tspan dx="4" font-style="italic">t</tspan><tspan dy="4" font-size="11" font-style="italic">i</tspan><tspan dy="-4" dx="4">+</tspan><tspan dx="4" font-style="italic">d</tspan><tspan dy="4" font-size="11" font-style="italic">i</tspan></text>
<path d="M455 42 L562 74" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M455 95 L562 95" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M455 148 L562 116" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="510" y="192" text-anchor="middle" font-size="14.5" fill="#444">authentic outputs</text>
<!-- back to agent -->
<path d="M770 95 L845 95 L845 228 L107.5 228 L107.5 153" stroke="#b71c1c" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="858" y="88" font-size="14.5" fill="#333">appended</text>
<text x="858" y="108" font-size="14.5" fill="#333">in order <tspan font-style="italic">π</tspan></text>
<!-- orders -->
<g font-size="15" fill="#222">
  <text x="195" y="274">Natural order <tspan font-style="italic">π</tspan><tspan dy="4" font-size="11">0</tspan><tspan dy="-4">:</tspan></text>
  <rect x="335" y="256" width="38" height="26" rx="4" fill="#eff8ef" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="354" y="274" text-anchor="middle"><tspan font-style="italic">o</tspan><tspan dy="4" font-size="11">1</tspan></text>
  <rect x="381" y="256" width="38" height="26" rx="4" fill="#eff8ef" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="400" y="274" text-anchor="middle"><tspan font-style="italic">o</tspan><tspan dy="4" font-size="11">2</tspan></text>
  <rect x="427" y="256" width="38" height="26" rx="4" fill="#eff8ef" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="446" y="274" text-anchor="middle"><tspan font-style="italic">o</tspan><tspan dy="4" font-size="11">3</tspan></text>
  <text x="478" y="274">→ choice A</text>

  <text x="195" y="312">Attack order <tspan font-style="italic">π</tspan>:</text>
  <rect x="335" y="294" width="38" height="26" rx="4" fill="#fdf0ef" stroke="#b71c1c" stroke-width="1.4"/>
  <text x="354" y="312" text-anchor="middle"><tspan font-style="italic">o</tspan><tspan dy="4" font-size="11">2</tspan></text>
  <rect x="381" y="294" width="38" height="26" rx="4" fill="#fdf0ef" stroke="#b71c1c" stroke-width="1.4"/>
  <text x="400" y="312" text-anchor="middle"><tspan font-style="italic">o</tspan><tspan dy="4" font-size="11">3</tspan></text>
  <rect x="427" y="294" width="38" height="26" rx="4" fill="#fdf0ef" stroke="#b71c1c" stroke-width="1.4"/>
  <text x="446" y="312" text-anchor="middle"><tspan font-style="italic">o</tspan><tspan dy="4" font-size="11">1</tspan></text>
  <text x="478" y="312">→ choice C</text>
</g>
<text x="615" y="286" font-size="14.5" fill="#444">same content, same hashes;</text>
<text x="615" y="306" font-size="14.5" fill="#444">only the completion order differs</text>
</svg>

